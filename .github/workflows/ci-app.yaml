name: CI applicazione

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Calcola il nome dell'immagine
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-lab-app:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build
        run: docker build --provenance=false -t "$IMAGE" app/

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "L'applicazione non risponde, log del container:"
          docker logs smoke
          exit 1

      #- name: Scansione vulnerabilità
      #  run: |
      #    docker run --rm \
      #      -v /var/run/docker.sock:/var/run/docker.sock \
      #      aquasec/trivy:latest image \
      #      --exit-code 1 \
      #      --severity HIGH,CRITICAL \
      #      --ignore-unfixed \
      #      "$IMAGE"

      - name: Login al registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pubblica l'immagine
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE"
