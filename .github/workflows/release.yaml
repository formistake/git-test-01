name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  promuovi:
    runs-on: ubuntu-latest
    steps:
      - name: Calcola i nomi delle immagini
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-lab-app"
          echo "SORGENTE=${REPO}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "DESTINAZIONE=${REPO}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Login al registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assegna la versione all'immagine già testata
        run: |
          docker pull "$SORGENTE"
          docker tag "$SORGENTE" "$DESTINAZIONE"
          docker push "$DESTINAZIONE"
