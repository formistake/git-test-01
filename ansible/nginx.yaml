- name: Installa nginx
  hosts: web
  become: true
  tasks:
    - name: Pacchetto nginx presente
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
    - name: Abilita e avvia il servizio nginx
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
